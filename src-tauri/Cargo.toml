[package]
name = "secretary"
version = "0.1.0"
description = "Compact offline schedule window for a Notion CSV export"
authors = ["secretary"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "secretary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
