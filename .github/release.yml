# Release の自動生成ノートを、プルリクエストのラベルで日本語の見出しに分ける。
# ラベルが無いもの、ここにある見出しに入らないものは「その他の変更」に入る。
changelog:
  categories:
    - title: 新機能
      labels:
        - enhancement
        - feature
    - title: 不具合修正
      labels:
        - bug
        - fix
    - title: 依存関係
      labels:
        - dependencies
    - title: その他の変更
      labels:
        - "*"
