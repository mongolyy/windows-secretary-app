# ブランチへの push と pull_request で、リント、テスト、カバレッジ、監査、Windows ビルドを行う。
# タグの push はここでは動かさない。インストーラは release.yml が作る。
# main への push では、ビルドした開発版を成果物に 3 日残す。
# 同じリポジトリからの pull_request は、同じ SHA の push ですでに走っているのでジョブをスキップする。
# フォークからの pull_request は push がこのリポジトリに届かないので、こちらで実行する。

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: フロントエンド
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: バージョン表記が揃っているか確認する
        run: node scripts/version.mjs check-consistent

      - name: スクリプトのテスト
        run: node --test scripts/*.test.mjs

      - name: npm の依存関係を入れる
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript の型チェック
        run: npm run typecheck

      - name: Vitest とカバレッジ
        run: npm run test:coverage

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: フロントエンドのカバレッジを保存する
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: coverage/frontend
          retention-days: 14
          if-no-files-found: error

  rust:
    name: Rust
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: cargo fmt
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: cargo-llvm-cov と cargo-audit を入れる
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov,cargo-audit

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: cargo test とカバレッジ
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --all-targets --locked --lcov --output-path coverage/rust/lcov.info

      - name: Rust のカバレッジを保存する
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage/rust/lcov.info
          retention-days: 14
          if-no-files-found: error

  windows-build:
    name: Windows ビルド
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: npm の依存関係を入れる
        run: npm ci

      - name: Windows アプリをビルドする
        run: npm run tauri build

      - name: ポータブル版とチェックサムを作り、確認する
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          DEV_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(
            --exe src-tauri/target/release/secretary.exe
            --setup-dir src-tauri/target/release/bundle/nsis
            --out release-assets
          )
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/main" ]; then
            args+=(--channel dev --revision "${DEV_REVISION:0:7}")
          fi
          node scripts/collect-release-assets.mjs "${args[@]}"
          node scripts/release-smoke.mjs release-assets

      - name: 開発版を成果物として保存する
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secretary-dev-${{ github.sha }}
          path: release-assets
          retention-days: 3
          if-no-files-found: error
