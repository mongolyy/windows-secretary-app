# Actions の画面で SemVer を渡すと、main のバージョンを更新してコミットし、タグを打つ。
# そのあと release.yml を直接呼ぶ。GITHUB_TOKEN で push したタグは、別ワークフローの push トリガーを起動しないため。
# このファイルが main に入ったあと、実行するブランチは main を選ぶ。
# git push をするのは prepare だけ。その checkout だけ資格情報を残す。呼び出し先のビルドは残さない。
# シークレットは release.yml が宣言したものだけを渡す。

name: バージョンを指定してリリースする

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer（例 0.1.0 または 0.2.0-rc.1）。先頭の v は付けない
        required: true
        type: string

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  prepare:
    name: バージョンを更新してタグを打つ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
      sha: ${{ steps.cut.outputs.sha }}
    steps:
      - name: ランナーの通信を監査する
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: main で実行されているか確認する
        if: github.ref != 'refs/heads/main'
        run: |
          echo "このワークフローは、Actions の画面でブランチ main を選んで実行してください。"
          echo "別のブランチの定義では main にコミットしません。"
          exit 1

      # main へのコミットとタグの push に、checkout の資格情報を残す。他のジョブは残さない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: バージョンを検証してタグを打つ
        id: cut
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/version.mjs validate "$RELEASE_VERSION"
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "タグ ${tag} は既にあります。別のバージョンを指定してください。"
            exit 1
          fi
          node scripts/version.mjs set "$RELEASE_VERSION"
          node scripts/version.mjs check "$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json electrobun.config.ts
          if ! git diff --cached --quiet; then
            git commit -m "バージョンを ${RELEASE_VERSION} に上げる。"
          else
            echo "バージョンは既に ${RELEASE_VERSION} です。新しいコミットは作りません。"
          fi
          if ! git diff --quiet; then
            echo "バージョン以外の差分が残っています。コミットしません。"
            git status --short
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git tag "$tag" "$sha"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  release:
    name: リリースを作る
    needs: prepare
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] actionlint 1.7.12 は $/ を再利用ワークフローと認識しない。./ はこのリポジトリ内。
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
