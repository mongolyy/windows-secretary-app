# Bun と GitHub Actions の更新を週次でプルリクエストにする。
# cooldown は公開直後の版をバージョン更新に取り込まない。セキュリティ更新には適用されない。
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 4
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # アクションの参照は SemVer の日数指定を受け付けない。default-days だけを書く。
    cooldown:
      default-days: 7
    labels:
      - dependencies
